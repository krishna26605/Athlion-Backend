service: athlion-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  memorySize: 512
  timeout: 90
  environment:
    NODE_ENV: production
    MONGODB_URI: ${ssm:/athlion/MONGODB_URI}
    JWT_SECRET: ${ssm:/athlion/JWT_SECRET}
    RAZORPAY_KEY_ID: ${ssm:/athlion/RAZORPAY_KEY_ID}
    RAZORPAY_KEY_SECRET: ${ssm:/athlion/RAZORPAY_KEY_SECRET}
    TWILIO_ACCOUNT_SID: ${ssm:/athlion/TWILIO_ACCOUNT_SID}
    TWILIO_AUTH_TOKEN: ${ssm:/athlion/TWILIO_AUTH_TOKEN}
    TWILIO_WHATSAPP_NUMBER: ${ssm:/athlion/TWILIO_WHATSAPP_NUMBER}
    SMTP_HOST: ${ssm:/athlion/SMTP_HOST}
    SMTP_PORT: ${ssm:/athlion/SMTP_PORT}
    SMTP_USER: ${ssm:/athlion/SMTP_USER}
    SMTP_PASS: ${ssm:/athlion/SMTP_PASS}
    FROM_EMAIL: ${ssm:/athlion/FROM_EMAIL}
    FROM_NAME: ATHLiON
    GEMINI_API_KEY: ${ssm:/athlion/GEMINI_API_KEY}
    GROQ_API_KEY: ${ssm:/athlion/GROQ_API_KEY}
    OPENAI_API_KEY: ${ssm:/athlion/OPENAI_API_KEY}

functions:
  api:
    handler: handler.handler
    # Lambda Function URL — supports up to 15-minute timeout, avoiding API Gateway's 29s limit.
    # Required for the AI chatbot which may run multi-step tool loops.
    url:
      cors:
        allowedOrigins:
          - https://athlion-frontend.vercel.app
          - http://localhost:3000
        allowedHeaders:
          - Content-Type
          - Authorization
        allowedMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowCredentials: true

plugins:
  - serverless-offline

package:
  patterns:
    - '!.git/**'
    - '!.env'
    - '!node_modules/aws-sdk/**'
    - '!**/*.md'
    - '!src/create-test-event.js'
    - '!src/verify-race-creation.js'
